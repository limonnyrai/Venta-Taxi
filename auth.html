<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venta Taxi — Авторизация</title><style>body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}.box{width:100%;max-width:380px;background:#1b1b1b;border:1px solid #333;border-radius:22px;padding:22px;box-sizing:border-box}.logo{text-align:center;font-size:38px;font-weight:900;color:#d4a83f}.sub{text-align:center;color:#aaa;margin:5px 0 18px}.tabs{display:flex;gap:8px}.tab{flex:1;padding:10px;border-radius:11px;border:1px solid #333;background:#111;color:#aaa;cursor:pointer}.tab.on{color:#d4a83f;border-color:#d4a83f}.hide{display:none}label{display:block;font-size:13px;color:#aaa;margin:12px 0 5px}input{width:100%;padding:13px;box-sizing:border-box;border-radius:11px;background:#0d0d0d;border:1px solid #3a3a3a;color:#fff;font-size:16px}button.main{width:100%;margin-top:14px;padding:13px;border:0;border-radius:11px;background:#d4a83f;color:#111;font-size:16px;font-weight:900;cursor:pointer}button.alt{width:100%;margin-top:9px;padding:11px;border:1px solid #444;border-radius:11px;background:#282828;color:#fff;cursor:pointer}.msg{text-align:center;min-height:22px;margin-top:12px;font-size:14px}.ok{color:#7fe0a7}.err{color:#ff8d82}.code{text-align:center;letter-spacing:8px}</style></head><body><div class="box"><div class="logo">Venta</div><div class="sub">Вход и регистрация</div><div class="tabs"><button id="regTab" class="tab on">Регистрация</button><button id="loginTab" class="tab">Войти</button></div><div id="reg"><label>E-mail</label><input id="re" type="email" autocomplete="email"><label>Пароль</label><input id="rp" type="password" autocomplete="new-password"><button id="regBtn" class="main">Зарегистрироваться</button><div id="codeBox" class="hide"><label>Код из письма</label><input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="123456"><button id="verify" class="main">Подтвердить</button><button id="resend" class="alt">Отправить код ещё раз</button></div></div><div id="login" class="hide"><label>E-mail</label><input id="le" type="email" autocomplete="email"><label>Пароль</label><input id="lp" type="password" autocomplete="current-password"><button id="loginBtn" class="main">Войти</button></div><div id="msg" class="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='PASTE_YOUR_SUPABASE_PROJECT_URL';const SUPABASE_KEY='PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let pending='';const $=x=>document.getElementById(x);const msg=(t,c='')=>{$('msg').textContent=t;$('msg').className='msg '+c};const go=()=>location.replace('index.html');$('regTab').onclick=()=>{ $('reg').classList.remove('hide');$('login').classList.add('hide');$('regTab').classList.add('on');$('loginTab').classList.remove('on');msg('');};$('loginTab').onclick=()=>{$('reg').classList.add('hide');$('login').classList.remove('hide');$('loginTab').classList.add('on');$('regTab').classList.remove('on');msg('');};(async()=>{const {data}=await sb.auth.getSession();if(data.session)go()})();$('regBtn').onclick=async()=>{const email=$('re').value.trim().toLowerCase(),password=$('rp').value;if(!email||!password)return msg('Заполни e-mail и пароль','err');if(password.length<6)return msg('Пароль минимум 6 символов','err');$('regBtn').disabled=true;msg('Отправляем код…');try{const {error}=await sb.auth.signUp({email,password});if(error)throw error;pending=email;$('codeBox').classList.remove('hide');msg('Код отправлен на почту','ok')}catch(e){msg(e.message||'Ошибка','err')}$('regBtn').disabled=false};$('verify').onclick=async()=>{const token=$('code').value.trim();if(!/^\d{6}$/.test(token))return msg('Введи 6-значный код','err');$('verify').disabled=true;msg('Проверяем…');try{const {data,error}=await sb.auth.verifyOtp({email:pending,token,type:'signup'});if(error)throw error;if(data.session){msg('Готово! Открываем сайт…','ok');setTimeout(go,300)}else msg('E-mail подтверждён. Войди через вкладку «Войти».','ok')}catch(e){msg(e.message||'Неверный код','err')}$('verify').disabled=false};$('resend').onclick=async()=>{if(!pending)return;const {error}=await sb.auth.resend({type:'signup',email:pending});msg(error?error.message:'Новый код отправлен',''+(error?'err':'ok'))};$('loginBtn').onclick=async()=>{const email=$('le').value.trim().toLowerCase(),password=$('lp').value;if(!email||!password)return msg('Заполни e-mail и пароль','err');$('loginBtn').disabled=true;msg('Входим…');try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;msg('Успешно! Открываем сайт…','ok');setTimeout(go,300)}catch(e){msg(e.message||'Неверный e-mail или пароль','err')}$('loginBtn').disabled=false};</script></body></html>
